<!doctype html>
<html lang="en">
<head>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cog &amp; Coal</title>
<style>
@font-face{font-family:"Russo One";src:url(fonts/russo-one-latin-400-normal.woff2) format("woff2");font-display:swap;unicode-range:U+0000-024F}
@font-face{font-family:"Russo One";src:url(fonts/russo-one-cyrillic-400-normal.woff2) format("woff2");font-display:swap;unicode-range:U+0400-04FF}
@font-face{font-family:"Nunito";font-weight:400;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2");font-display:swap;unicode-range:U+0000-024F}
@font-face{font-family:"Nunito";font-weight:400;src:url(fonts/nunito-cyrillic-400-normal.woff2) format("woff2");font-display:swap;unicode-range:U+0400-04FF}
@font-face{font-family:"Nunito";font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");font-display:swap;unicode-range:U+0000-024F}
@font-face{font-family:"Nunito";font-weight:800;src:url(fonts/nunito-cyrillic-800-normal.woff2) format("woff2");font-display:swap;unicode-range:U+0400-04FF}
/* Layout: one-screen idle game. Living factory scene on top, production lines below. Single warm-dusk cartoon world. */
:root{
  --bg:#1d1a2b; --panel:#2a2540; --line:#433b62; --fg:#fff6e6; --muted:#b9aed6;
  --gold:#ffc23d; --gold-dk:#c98a00; --ember:#ff7a3d; --ok:#7ee08a;
  --display:"Russo One","Arial Black",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-weight:400}
.wrap{max-width:560px;height:100%;box-sizing:border-box;margin:0 auto;padding-block:10px 10px;display:flex;flex-direction:column;gap:10px}
.stage,header,.foot{flex:none}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--gold);letter-spacing:.02em;text-shadow:0 2px 0 #00000055}
.hud{display:flex;align-items:center;gap:8px}
.coinbox{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px}
.coin-ic{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,var(--gold) 55%,var(--gold-dk));border:2px solid #7a5200}
.coins{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.rate{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;text-align:right}
.lang{font-size:.75rem;padding:5px 8px}
.stage{position:relative;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#2b2f5e}
canvas{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.boost{position:absolute;right:8px;top:8px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;white-space:nowrap;background:#000a;color:var(--fg);font-size:.8rem;padding:4px 8px;border-radius:8px;pointer-events:none}
button{font-family:var(--display);border:2px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:10px;padding:8px 12px;font-size:.9rem;cursor:pointer;transition:transform .08s}
button:active:not(:disabled){transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.buy{background:var(--gold);color:#3a2600;border-color:var(--gold-dk);box-shadow:0 3px 0 var(--gold-dk);min-width:104px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:6px}
button.buy .coin-ic{width:14px;height:14px;border-width:1.5px}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
button.ad{background:var(--ember);border-color:#b8461a;box-shadow:0 3px 0 #b8461a;color:#fff;font-size:.8rem;padding:6px 10px}
.goal{flex:none;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:linear-gradient(90deg,#3b2f63,var(--panel));border:2px solid var(--gold-dk);border-radius:12px;padding:8px 10px}
.goal .lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.goal.done{border-color:var(--gold);box-shadow:0 0 0 3px #ffc23d33}
.up{font-family:var(--body);font-weight:800;font-size:.72rem;padding:2px 7px;border-radius:999px;margin-left:4px;background:#3b2f63;border-color:var(--gold-dk);color:var(--gold)}
.lines{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.row.locked{opacity:.4}
.row canvas{width:44px;height:44px;cursor:default}
.name{font-weight:800}
.meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#00000055;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));width:0}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:18px;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{font-family:var(--display);margin:0;color:var(--gold);font-size:1.15rem}
.card p{margin:0;line-height:1.45}
.card ol{text-align:left;margin:0;padding-left:20px;line-height:1.45;font-size:.92rem}
.card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (min-width:820px) and (min-aspect-ratio:5/4){
  .wrap{max-width:1180px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"head head" "stage goal" "stage lines" "stage foot"}
  .goal{grid-area:goal}
  header{grid-area:head}.stage{grid-area:stage;align-self:start}.lines{grid-area:lines}.foot{grid-area:foot}
}
.rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;font-family:var(--display);color:var(--gold);font-size:1.2rem;padding:24px}
@media (orientation:landscape) and (pointer:coarse) and (max-height:500px){.rotate{display:flex}}
.coinbox.punch{animation:punch .18s ease-out}@keyframes punch{50%{transform:scale(1.12)}}
.nudge{animation:nudge 1s ease-in-out infinite}@keyframes nudge{0%,100%{box-shadow:0 3px 0 var(--gold-dk),0 0 0 0 #ffc23daa}50%{box-shadow:0 3px 0 var(--gold-dk),0 0 0 8px #ffc23d00;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.nudge,.coinbox.punch{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#3a2600;padding:8px 14px;border-radius:10px;font-weight:800;z-index:30}
</style>

<div class="wrap">
  <header>
    <h1>COG &amp; COAL</h1>
    <div class="hud">
      <div><div class="coinbox"><span class="coin-ic"></span><span class="coins" id="coins">0</span></div><div class="rate" id="rate"></div></div>
      <button class="lang" id="soundBtn" aria-label="Sound">🔊</button>
      <button class="lang" id="langBtn" aria-label="Language">EN</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv" aria-label="Factory"></canvas>
    <div class="hint" id="hint"></div>
    <div class="boost"><button class="ad" id="boostBtn"></button></div>
  </div>
  <div class="goal" id="goal"><div style="min-width:0"><div class="lbl" id="goalLbl"></div><div class="name" id="goalTxt"></div><div class="bar"><i id="goalBar"></i></div></div>
    <button class="buy" id="goalBtn"></button></div>
  <div class="lines" id="lines"></div>
  <div class="foot">
    <span id="bpInfo"></span>
    <span style="display:flex;gap:8px"><button id="helpBtn">?</button><button id="prestigeBtn"></button></span>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="rotate" id="rotate">↻ Rotate your device</div>

<script>
// ================= Text =================
const T={
 en:{rate:'/ sec',hint:'Tap the factory to earn coins',tapCall:'TAP!',lucky:'Lucky airship! +{v}',boost:'▶ ×2 for 3 min',boostOn:'×2 active · {s}s',boostToast:'Output doubled for 3 minutes',
  each:'+{v}/s each',per:'{v}/s',next:'×2 at {n}',locked:'Build the line above first',milestone:'{n}: output ×2!',
  bp:'Blueprints: {n} (+{p}%)',rebuildLocked:'Rebuild at 1B',rebuild:'Rebuild (+{n})',
  rebuildQ:'Rebuild the factory?',rebuildP:'You lose coins and buildings but keep <b>{n}</b> blueprints. Each blueprint gives +10% to all income forever.',
  yes:'Rebuild',no:'Not yet',awayT:'While you were away',awayP:'Your factory made <b>{v}</b> coins in {m} min.',collect:'Collect',collect2:'▶ Collect ×2',adTest:'(test) ad playing…',adOff:'Bonus ads are unavailable right now',
  goalLbl:'Goal',goalBuild:'Build {n} × {name}',claim:'Claim',claimed:'Goal reward: +{v}',up:'⬆ ×2 · {c}',upToast:'{name} upgraded: income ×2',allDone:'All goals done!',
  helpT:'How to play',help:['Tap the factory to earn your first coins. Catch the golden airship for a bonus.','Complete goals for bonus coins. Upgrade buildings (⬆) to double their income.','Buy buildings. Each one earns coins every second, even when you do nothing.','Owning 25, 50, 100… of one building doubles its income.','The factory works while the game is closed (half speed, up to 2 hours).','At 1 billion coins (1B), rebuild the factory for blueprints: +10% income each, forever.'],ok:'Got it',
  names:['Coal Mine','Smelter','Gear Press','Steam Forge','Engine Works','Rail Foundry','Airship Yard']},
 ru:{rate:'/ сек',hint:'Нажимай на завод, чтобы получить монеты',tapCall:'ЖМИ!',lucky:'Золотой дирижабль! +{v}',boost:'▶ ×2 на 3 мин',boostOn:'×2 включено · {s}с',boostToast:'Доход удвоен на 3 минуты',
  each:'+{v}/с за штуку',per:'{v}/с',next:'×2 на {n}',locked:'Сначала построй цех выше',milestone:'{n}: доход ×2!',
  bp:'Чертежи: {n} (+{p}%)',rebuildLocked:'Перестройка с 1B',rebuild:'Перестроить (+{n})',
  rebuildQ:'Перестроить завод?',rebuildP:'Монеты и цеха обнулятся, но ты получишь чертежи: всего <b>{n}</b>. Каждый чертёж навсегда даёт +10% ко всему доходу.',
  yes:'Перестроить',no:'Позже',awayT:'Пока тебя не было',awayP:'Завод заработал <b>{v}</b> монет за {m} мин.',collect:'Забрать',collect2:'▶ Забрать ×2',adTest:'(тест) идёт реклама…',adOff:'Реклама с бонусом сейчас недоступна',
  goalLbl:'Задание',goalBuild:'Построй {n} × {name}',claim:'Забрать',claimed:'Награда: +{v}',up:'⬆ ×2 · {c}',upToast:'{name}: доход ×2',allDone:'Все задания выполнены!',
  helpT:'Как играть',help:['Нажимай на завод, чтобы заработать первые монеты. Лови золотой дирижабль ради бонуса.','Выполняй задания за бонусные монеты. Улучшай цеха (⬆), чтобы удвоить их доход.','Покупай цеха. Каждый цех сам приносит монеты каждую секунду, даже когда ты ничего не делаешь.','Когда у тебя 25, 50, 100… одинаковых цехов, их доход удваивается.','Завод работает и когда игра закрыта: вдвое медленнее, до 2 часов.','С миллиарда монет (1B) можно перестроить завод и получить чертежи: каждый даёт +10% к доходу навсегда.'],ok:'Понятно',
  names:['Угольная шахта','Плавильня','Пресс шестерён','Паровая кузня','Моторный цех','Рельсовый завод','Верфь дирижаблей']},
 uk:{rate:'/ сек',hint:'Натискай на завод, щоб отримати монети',tapCall:'ТИСНИ!',lucky:'Золотий дирижабль! +{v}',boost:'▶ ×2 на 3 хв',boostOn:'×2 увімкнено · {s}с',boostToast:'Дохід подвоєно на 3 хвилини',
  each:'+{v}/с за штуку',per:'{v}/с',next:'×2 на {n}',locked:'Спершу збудуй цех вище',milestone:'{n}: дохід ×2!',
  bp:'Креслення: {n} (+{p}%)',rebuildLocked:'Перебудова з 1B',rebuild:'Перебудувати (+{n})',
  rebuildQ:'Перебудувати завод?',rebuildP:'Монети й цехи обнуляться, але ти отримаєш креслення: усього <b>{n}</b>. Кожне креслення назавжди дає +10% до всього доходу.',
  yes:'Перебудувати',no:'Пізніше',awayT:'Поки тебе не було',awayP:'Завод заробив <b>{v}</b> монет за {m} хв.',collect:'Забрати',collect2:'▶ Забрати ×2',adTest:'(тест) іде реклама…',adOff:'Реклама з бонусом зараз недоступна',
  goalLbl:'Завдання',goalBuild:'Збудуй {n} × {name}',claim:'Забрати',claimed:'Нагорода: +{v}',up:'⬆ ×2 · {c}',upToast:'{name}: дохід ×2',allDone:'Усі завдання виконано!',
  helpT:'Як грати',help:['Натискай на завод, щоб заробити перші монети. Лови золотий дирижабль заради бонусу.','Виконуй завдання за бонусні монети. Покращуй цехи (⬆), щоб подвоїти їхній дохід.','Купуй цехи. Кожен цех сам приносить монети щосекунди, навіть коли ти нічого не робиш.','Коли маєш 25, 50, 100… однакових цехів, їхній дохід подвоюється.','Завод працює, навіть коли гру закрито: удвічі повільніше, до 2 годин.','З мільярда монет (1B) можна перебудувати завод і отримати креслення: кожне дає +10% до доходу назавжди.'],ok:'Зрозуміло',
  names:['Вугільна шахта','Плавильня','Прес шестерень','Парова кузня','Моторний цех','Рейковий завод','Верф дирижаблів']},
};
const LANGS=['en','ru','uk'];
const mapLang=n=>{n=String(n||'en').slice(0,2).toLowerCase();return n==='uk'?'uk':['ru','be','kk'].includes(n)?'ru':'en'};
let lang='en';
const t=(k,v={})=>String(T[lang][k]).replace(/\{(\w+)\}/g,(_,x)=>v[x]);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ================= Sound: music + effects from mp3 files; silent while paused, hidden, muted or during ads =================
const Snd={flags:{user:false,platMute:false,platPause:false,ad:false,hidden:false},music:null,started:false,pool:{},
  init(){this.music=new Audio('audio/music.mp3');this.music.loop=true;this.music.volume=.3;
    ['tap','buy','milestone','reward','rebuild'].forEach(n=>{const a=new Audio('audio/'+n+'.mp3');a.preload='auto';this.pool[n]=a})},
  muted(){const f=this.flags;return f.user||f.platMute||f.platPause||f.ad||f.hidden},
  set(k,v){this.flags[k]=v;this.apply()},
  apply(){if(this.music){if(this.muted()||!this.started)this.music.pause();else this.music.play().catch(()=>{})}
    const b=document.getElementById('soundBtn');if(b)b.textContent=this.flags.user?'🔇':'🔊'},
  start(){if(this.started||!this.music)return;this.started=true;this.apply()},
  play(n,vol=.6){if(this.muted()||!this.started||!this.pool[n])return;const a=this.pool[n].cloneNode();a.volume=vol;a.play().catch(()=>{})}};
const paused=()=>Snd.flags.platPause||Snd.flags.ad;

// ================= Platform: Playgama Bridge when present, local fallback otherwise =================
// ================= Platform: Playgama Bridge, CrazyGames SDK v3, or local fallback =================
const B=window.bridge;let HAS_B=false,rewardWait=null;
const CGW=window.CrazyGames;let CG=null;
const adOn=()=>{Snd.set('ad',true);try{CG&&CG.game.gameplayStop()}catch(e){}};
const adOff=()=>{Snd.set('ad',false);try{CG&&CG.game.gameplayStart()}catch(e){}};
const Plat={adsOff:false,
  async init(){
    if(B){try{await B.initialize();HAS_B=true}catch(e){HAS_B=false}}
    else if(CGW&&CGW.SDK){try{await CGW.SDK.init();if(CGW.SDK.environment!=='disabled'){CG=CGW.SDK;try{CG.game.loadingStart()}catch(e){}}}catch(e){CG=null}}
    let pl=null;
    if(HAS_B)pl=B.platform.language;
    else if(CG){try{const si=CG.user&&CG.user.systemInfo;pl=si&&(si.locale||si.language||(si.browser&&si.browser.locale))}catch(e){}}
    lang=pl?mapLang(pl):(HAS_B||CG)?mapLang(navigator.language):(ls.get('cogcoal_lang')||mapLang(navigator.language));
    if(CG){
      const applyCG=st=>Snd.set('platMute',!!(st&&st.muteAudio));
      try{applyCG(CG.game.settings)}catch(e){}
      try{CG.game.addSettingsChangeListener&&CG.game.addSettingsChangeListener(applyCG)}catch(e){}
    }
    if(!HAS_B)return;
    try{Snd.flags.platMute=!B.platform.isAudioEnabled}catch(e){}
    B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED,on=>Snd.set('platMute',!on));
    B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED,p=>Snd.set('platPause',!!p));
    B.advertisement.on(B.EVENT_NAME.INTERSTITIAL_STATE_CHANGED,st=>{if(st==='opened')Snd.set('ad',true);if(st==='closed'||st==='failed')Snd.set('ad',false)});
    B.advertisement.on(B.EVENT_NAME.REWARDED_STATE_CHANGED,st=>{
      if(st==='opened')Snd.set('ad',true);
      if(st==='rewarded'&&rewardWait){rewardWait(true);rewardWait=null}
      if(st==='closed'||st==='failed'){Snd.set('ad',false);if(rewardWait){rewardWait(false);rewardWait=null}}});
  },
  async load(){let raw=null;
    if(HAS_B){try{const d=await B.storage.get([KEY]);raw=d&&d[0]}catch(e){}}
    else if(CG){try{raw=CG.data.getItem(KEY)}catch(e){}}
    else raw=ls.get(KEY);
    if(raw){try{return typeof raw==='string'?JSON.parse(raw):raw}catch(e){}}return null},
  save(obj){const v=JSON.stringify(obj);
    if(HAS_B)B.storage.set([KEY],[v]).catch(()=>{});
    else if(CG){try{CG.data.setItem(KEY,v)}catch(e){}}
    else ls.set(KEY,v)},
  rewarded(){return new Promise(res=>{
    if(HAS_B){if(!B.advertisement.isRewardedSupported){res(false);return}
      rewardWait=res;try{B.advertisement.showRewarded()}catch(e){rewardWait=null;res(false)}return}
    if(CG){let done=false;const fin=v=>{if(done)return;done=true;adOff();res(v)};
      try{CG.ad.requestAd('rewarded',{adStarted:adOn,adFinished:()=>fin(true),
        adError:err=>{if(err&&err.code==='adsDisabled'){Plat.adsOff=true;toast(t('adOff'));render()}fin(false)}})}catch(e){fin(false)}return}
    toast(t('adTest'));Snd.set('ad',true);setTimeout(()=>{Snd.set('ad',false);res(true)},1500)})},
  lastAd:performance.now()-30000,
  interstitial(){const now=performance.now();if(now-this.lastAd<120000)return;this.lastAd=now;
    if(HAS_B){if(B.advertisement.isInterstitialSupported)try{B.advertisement.showInterstitial()}catch(e){}return}
    if(CG&&!Plat.adsOff){try{CG.ad.requestAd('midgame',{adStarted:adOn,adFinished:adOff,adError:adOff})}catch(e){}}},
  ready(){if(HAS_B)try{B.platform.sendMessage('game_ready')}catch(e){}
    if(CG){try{CG.game.loadingStop()}catch(e){}try{CG.game.gameplayStart()}catch(e){}}}};

// ================= Economy =================
const LINES=[
  {id:'mine',base:10,inc:0.5},{id:'smelter',base:100,inc:3},{id:'press',base:1500,inc:20},{id:'forge',base:2.5e4,inc:120},
  {id:'works',base:4e5,inc:700},{id:'foundry',base:7e6,inc:4000},{id:'yard',base:1.3e8,inc:23000}];
const GROWTH=1.15,MILESTONES=[25,50,100,150,200],KEY='cogcoal_v2';
const fresh=()=>({coins:0,lifetime:0,owned:{},bp:0,boostUntil:0,last:Date.now(),seenHelp:false,mute:false,up:{},q:0});
let S=fresh();
const save=()=>{S.last=Date.now();Plat.save(S)};
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const u=['K','M','B','T','Qa','Qi','Sx'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
const own=id=>S.owned[id]||0;
const cost=l=>Math.ceil(l.base*Math.pow(GROWTH,own(l.id)));

      ART[l.id](c,p.x,p.g,p.s,tm);c.restore();bounce[i]=Math.max(0,b-dt*4);
      if(!window.__cover){const txt='×'+n;c.font=`700 ${Math.round(p.s*.16)}px Nunito, sans-serif`;const tw=c.measureText(txt).width+10;
      shape(c,'#ffc23d',rr(c,p.x-tw/2,p.g+3,tw,p.s*.2,6),2);c.fillStyle='#3a2600';c.textAlign='center';c.fillText(txt,p.x,p.g+3+p.s*.155);}
      (SMOKE_FROM[l.id]||[]).forEach(([ox,oy])=>{if(Math.random()<dt*(2+Math.min(6,n/5)))smoke.push({x:p.x+ox*p.s,y:p.g+oy*p.s,r:p.s*.05,l:1})});
      if(!window.__cover&&Math.random()<dt*.6)pops.push({x:p.x,y:p.g-p.s*.6,txt:'+'+fmt(lineRate(l)),l:1.3,coin:true});
    }else{const next=!nextShown;nextShown=true;drawLot(c,p,next,cost(l),S.coins>=cost(l),tm)}
  });
  // main factory
  {const p=hqPos(),b=hqBounce;c.save();c.translate(p.x,p.g);c.scale(1+b*.07,1-b*.07);c.translate(-p.x,-p.g);drawHQ(c,p.x,p.g,p.s,tm);c.restore();hqBounce=Math.max(0,b-dt*5);
    if(Math.random()<dt*(1.5+(any?2:0)))smoke.push({x:p.x-p.s*.255,y:p.g-p.s*1.08,r:p.s*.05,l:1});
    // first-time call to action: "TAP!" over the main factory
    if(!window.__cover&&own('mine')===0&&S.lifetime<12){const k=(tm*1.6)%1;c.strokeStyle=`rgba(255,194,61,${1-k})`;c.lineWidth=4;c.beginPath();c.arc(p.x,p.g-p.s*.45,p.s*(.35+k*.4),0,7);c.stroke();
      const by=p.g-p.s*.08+Math.sin(tm*6)*4;c.font=`${Math.round(p.s*.3)}px "Russo One", sans-serif`;c.textAlign='center';c.lineWidth=5;c.strokeStyle=OUT;c.strokeText(t('tapCall'),p.x,by);c.fillStyle='#ffc23d';c.fillText(t('tapCall'),p.x,by)}}
  // lucky airship
  const now=performance.now();
  if(!lucky&&!paused()&&now>luckyAt&&own('mine')>0&&!window.__cover){const dir=Math.random()<.5?1:-1;lucky={x:dir>0?-40:W+40,y:H*(.12+Math.random()*.1),dir,t:0}}
  if(lucky){lucky.t+=dt;lucky.x+=lucky.dir*dt*W/11;lucky.y+=Math.sin(lucky.t*2)*.3;drawLucky(c,tm);
    if(lucky.x<-60||lucky.x>W+60){lucky=null;luckyAt=now+60000+Math.random()*60000}}
  smoke.forEach(s=>{s.y-=dt*18;s.x+=dt*6;s.r+=dt*6;s.l-=dt*.45});smoke=smoke.filter(s=>s.l>0);
  smoke.forEach(s=>{c.fillStyle=`rgba(220,210,235,${s.l*.55})`;c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});
  sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=260*dt;s.l-=dt});sparks=sparks.filter(s=>s.l>0);
  sparks.forEach(s=>{c.globalAlpha=Math.min(1,s.l*1.5);shape(c,'#ffc23d',()=>c.arc(s.x,s.y,Math.max(3,S_SIZE()*.04),0,7),1.5)});c.globalAlpha=1;
  pops.forEach(p=>{p.y-=dt*28;p.l-=dt});pops=pops.filter(p=>p.l>0);
  c.textAlign='center';pops.forEach(p=>{c.globalAlpha=Math.min(1,p.l);c.font=`800 ${p.big?18:13}px Nunito, sans-serif`;
    if(p.coin){shape(c,'#ffc23d',()=>c.arc(p.x-c.measureText(p.txt).width/2-8,p.y-4,5,0,7),1.5)}
    c.lineWidth=3;c.strokeStyle=OUT;c.strokeText(p.txt,p.x,p.y);c.fillStyle=p.big?'#ffc23d':'#fff6e6';c.fillText(p.txt,p.x,p.y)});c.globalAlpha=1;
}
function punch(){const el=document.querySelector('.coinbox');el.classList.remove('punch');void el.offsetWidth;el.classList.add('punch')}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(lucky&&Math.hypot(x-lucky.x,y-lucky.y)<S_SIZE()*.7){const v=luckyReward();earn(v);
    for(let i=0;i<12;i++)sparks.push({x:lucky.x,y:lucky.y,vx:(Math.random()-.5)*220,vy:-60-Math.random()*160,l:1.1});
    pops.push({x:lucky.x,y:lucky.y-10,txt:'+'+fmt(v),l:1.6,coin:true,big:true});toast(t('lucky',{v:fmt(v)}));Snd.play('reward');
    lucky=null;luckyAt=performance.now()+60000+Math.random()*60000;punch();render();return}
  const v=tapValue();earn(v);hqBounce=1;
  LINES.forEach((l,i)=>{const p=slotPos(i);if(own(l.id)&&Math.abs(x-p.x)<p.s*.5&&y<p.g&&y>p.g-p.s)bounce[i]=1});
  const h=hqPos();for(let i=0;i<3;i++)sparks.push({x:h.x-h.s*.22,y:h.g-h.s*.4,vx:(Math.random()-.5)*120,vy:-120-Math.random()*80,l:.7});
  pops.push({x,y,txt:'+'+fmt(v),l:1,coin:true});Snd.play('tap',.35);punch();render()});

// ================= UI =================
const $=id=>document.getElementById(id);
function toast(s){const el=$('toast');el.textContent=s;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,1800)}
function modal(html,buttons){$('card').innerHTML=html+'<div class="btns"></div>';const b=$('card').querySelector('.btns');
  buttons.forEach(([label,fn,cls])=>{const x=document.createElement('button');x.textContent=label;if(cls)x.className=cls;x.onclick=()=>{$('modal').hidden=true;fn&&fn()};b.appendChild(x)});
  $('modal').hidden=false}
function help(){modal(`<h2>${t('helpT')}</h2><ol>${T[lang].help.map(h=>`<li>${h}</li>`).join('')}</ol>`,[[t('ok'),()=>{S.seenHelp=true;save()},'buy']])}

function buildRows(){$('lines').innerHTML=LINES.map(l=>`
  <div class="row" id="r-${l.id}"><canvas id="i-${l.id}" width="88" height="88"></canvas><div style="min-width:0"><div class="name"><span id="n-${l.id}"></span> <span class="meta" id="o-${l.id}"></span><button class="up" id="u-${l.id}" hidden></button></div>
  <div class="meta" id="m-${l.id}"></div><div class="bar"><i id="b-${l.id}"></i></div></div>
  <button class="buy" id="k-${l.id}"><span class="coin-ic"></span><span id="c-${l.id}"></span></button></div>`).join('');
  LINES.forEach((l,i)=>{const ic=$('i-'+l.id).getContext('2d');ic.scale(2,2);ART[l.id](ic,22,40,36,0.6);
    $('u-'+l.id).onclick=()=>{const c=upCost(l);if(S.coins<c||!upReady(l))return;S.coins-=c;S.up=S.up||{};S.up[l.id]=upLvl(l)+1;bounce[i]=1;
      toast(t('upToast',{name:T[lang].names[i]}));Snd.play('milestone');render();save()};
    $('k-'+l.id).onclick=()=>{const c=cost(l);if(S.coins<c)return;S.coins-=c;S.owned[l.id]=own(l.id)+1;bounce[i]=1;
    if(MILESTONES.includes(own(l.id)))toast(t('milestone',{n:T[lang].names[i]}));Snd.play(MILESTONES.includes(own(l.id))?'milestone':'buy');render();save()}})}

function render(){
  $('coins').textContent=fmt(S.coins);
  $('rate').textContent=fmt(totalRate())+' '+t('rate')+(boostOn()?' · ×2':'');
  let prev=true;
  LINES.forEach((l,i)=>{const c=cost(l),o=own(l.id),vis=prev||o>0;
    $('r-'+l.id).classList.toggle('locked',!vis);$('n-'+l.id).textContent=T[lang].names[i];
    $('o-'+l.id).textContent=o?'×'+o:'';const next=MILESTONES.find(m=>o<m);
    $('m-'+l.id).textContent=vis?(o?t('per',{v:fmt(lineRate(l))}):t('each',{v:fmt(l.inc*bpMult())}))+(next?' · '+t('next',{n:next}):''):t('locked');
    $('b-'+l.id).style.width=next?Math.min(100,o/next*100)+'%':'100%';
    $('c-'+l.id).textContent=fmt(c);$('k-'+l.id).disabled=!vis||S.coins<c;prev=o>0;
    const u=$('u-'+l.id),uc=upCost(l);u.hidden=!upReady(l);u.textContent=t('up',{c:fmt(uc)});u.disabled=S.coins<uc});
  const gq=goal();$('goalLbl').textContent=t('goalLbl');
  if(gq){const gl=LINES[gq.i],have=Math.min(own(gl.id),gq.n),d=have>=gq.n;
    $('goalTxt').textContent=t('goalBuild',{n:gq.n,name:T[lang].names[gq.i]})+` (${have}/${gq.n})`;
    $('goalBar').style.width=have/gq.n*100+'%';$('goal').classList.toggle('done',d);
    $('goalBtn').hidden=false;$('goalBtn').disabled=!d;$('goalBtn').innerHTML=`<span class="coin-ic"></span>${d?t('claim')+' ':''}+${fmt(goalReward())}`}
  else{$('goalTxt').textContent=t('allDone');$('goalBar').style.width='100%';$('goalBtn').hidden=true;$('goal').classList.remove('done')}
  const nm=own('mine')===0&&S.coins>=cost(LINES[0]);$('k-mine').classList.toggle('nudge',nm);
  $('goalBtn').classList.toggle('nudge',!!gq&&goalDone()&&(S.q||0)<3);
  const g=bpGain();$('bpInfo').textContent=t('bp',{n:S.bp,p:S.bp*10});
  $('prestigeBtn').disabled=g<1;$('prestigeBtn').textContent=g<1?t('rebuildLocked'):t('rebuild',{n:g});
  const left=Math.max(0,S.boostUntil-Date.now());
  $('boostBtn').textContent=left?t('boostOn',{s:Math.ceil(left/1000)}):t('boost');$('boostBtn').disabled=!!left;$('boostBtn').hidden=Plat.adsOff&&!left;
  $('hint').textContent=t('hint');$('hint').hidden=true;$('langBtn').textContent=lang.toUpperCase();$('langBtn').hidden=HAS_B||!!CG;
}

$('langBtn').onclick=()=>{lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];ls.set('cogcoal_lang',lang);render()};
$('soundBtn').onclick=()=>{S.mute=!S.mute;Snd.set('user',S.mute);Snd.start();save()};
$('helpBtn').onclick=help;
$('goalBtn').onclick=()=>{if(!goalDone())return;const v=goalReward();earn(v);S.q=(S.q||0)+1;Snd.play('reward');toast(t('claimed',{v:fmt(v)}));punch();const h=hqPos();for(let i=0;i<10;i++)sparks.push({x:h.x,y:h.g-h.s*.6,vx:(Math.random()-.5)*200,vy:-100-Math.random()*150,l:1});render();save();Plat.interstitial()};
$('boostBtn').onclick=async()=>{if(await Plat.rewarded()){S.boostUntil=Date.now()+180000;Snd.play('reward');toast(t('boostToast'));save();render()}};
$('prestigeBtn').onclick=()=>{const g=bpGain();if(g<1)return;
  modal(`<h2>${t('rebuildQ')}</h2><p>${t('rebuildP',{n:S.bp+g})}</p>`,
   [[t('yes'),()=>{S=Object.assign(fresh(),{bp:S.bp+g,seenHelp:true,mute:S.mute});save();render();Snd.play('rebuild');Plat.interstitial()},'buy'],[t('no')]])};

// ================= Start =================
let t0=performance.now(),acc=0,lastSave=0;
function frame(now){const dt=Math.min(.1,(now-t0)/1000);t0=now;if(!paused())earn(totalRate()*dt);acc+=dt;drawScene(now/1000,dt);
  if(acc>.25){render();acc=0}if(now-lastSave>30000){lastSave=now;save()}requestAnimationFrame(frame)}
function offline(){const sec=Math.min(7200,(Date.now()-S.last)/1000);
  const r=LINES.reduce((a,l)=>a+own(l.id)*l.inc*mult(l)*bpMult(),0),gain=sec*r*.5;
  if(sec>60&&gain>0)modal(`<h2>${t('awayT')}</h2><p>${t('awayP',{v:fmt(gain),m:Math.round(sec/60)})}</p>`,
    [[t('collect2'),async()=>{const ok=await Plat.rewarded();earn(gain*(ok?2:1));if(ok)Snd.play('reward');render();save()},'buy'],
     [t('collect'),()=>{earn(gain);render();save();Plat.interstitial()}]]);
}
addEventListener('pointerdown',()=>Snd.start(),{capture:true});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('visibilitychange',()=>{Snd.set('hidden',document.hidden);if(document.hidden)save()});
(async()=>{
  await Plat.init();Snd.init();
  const d=await Plat.load();if(d)S=Object.assign(fresh(),d);
  Snd.flags.user=!!S.mute;Snd.apply();
  resize();buildRows();render();offline();
  requestAnimationFrame(t=>{t0=t;lastSave=t;frame(t);Plat.ready()});
})();
</script>
</html>
